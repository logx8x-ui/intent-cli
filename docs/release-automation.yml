name: Signed Intent release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['firefox-updates.json', 'docs/**', 'website/**']
permissions:
  contents: write
concurrency:
  group: intent-release
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || vars.INTENT_AUTO_RELEASE == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      INTENT_APPLICATION_IDENTITY: ${{ secrets.INTENT_APPLICATION_IDENTITY }}
      INTENT_INSTALLER_IDENTITY: ${{ secrets.INTENT_INSTALLER_IDENTITY }}
      INTENT_GOOGLE_CLIENT_SECRET: ${{ secrets.INTENT_GOOGLE_CLIENT_SECRET }}
      INTENT_SUPABASE_URL: ${{ secrets.INTENT_SUPABASE_URL }}
      INTENT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.INTENT_SUPABASE_PUBLISHABLE_KEY }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      INTENT_CHROME_WEB_STORE_URL: ${{ vars.INTENT_CHROME_WEB_STORE_URL }}
      INTENT_NOTARY_PROFILE: intent-notary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Choose the release version
        env:
          REQUESTED_REF: ${{ github.ref_name }}
          RELEASE_SERIES: ${{ vars.INTENT_RELEASE_SERIES }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$REQUESTED_REF"
          else
            series="${RELEASE_SERIES:-0.9}"
            [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]] || exit 1
            tag="v${series}.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Check release prerequisites
        env:
          CERTIFICATES_BASE64: ${{ secrets.INTENT_CERTIFICATES_BASE64 }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          for name in INTENT_APPLICATION_IDENTITY INTENT_INSTALLER_IDENTITY INTENT_GOOGLE_CLIENT_SECRET INTENT_SUPABASE_URL INTENT_SUPABASE_PUBLISHABLE_KEY AMO_JWT_ISSUER AMO_JWT_SECRET CERTIFICATES_BASE64; do
            [[ -n "${!name}" ]] || { echo "Missing release setting: $name"; exit 1; }
          done
      - name: Install dependencies and run regression checks
        run: |
          npm ci
          npm run test:swift
          npm run test:extensions
          npm run test:release-readiness
          python3 scripts/test-download-kits.py
          node scripts/test-download-page.mjs
          python3 scripts/check-account-service.py
      - name: Prepare temporary signing keychain
        env:
          CERTIFICATES_BASE64: ${{ secrets.INTENT_CERTIFICATES_BASE64 }}
          CERTIFICATES_PASSWORD: ${{ secrets.INTENT_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.INTENT_CI_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.INTENT_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.INTENT_NOTARY_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.INTENT_APPLE_TEAM_ID }}
        run: |
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"intent.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATES_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/intent.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/intent.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/intent.keychain-db"
          security import "$RUNNER_TEMP/intent.p12" -P "$CERTIFICATES_PASSWORD" -t cert -f pkcs12 -k "$RUNNER_TEMP/intent.keychain-db" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/intent.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/intent.keychain-db" login.keychain-db
          xcrun notarytool store-credentials intent-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" --password "$APPLE_PASSWORD" --keychain "$RUNNER_TEMP/intent.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/intent.keychain-db"
      - name: Build, notarize, and verify
        run: |
          scripts/build-release.sh "${RELEASE_TAG#v}" "$GITHUB_RUN_NUMBER"
          scripts/verify-release.sh
          python3 scripts/build-download-kits.py
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq .tag_name)"
          python3 -c 'import sys; v=lambda s:tuple(map(int,s.lstrip("v").split("."))); assert v(sys.argv[1])>v(sys.argv[2]), "Release must be newer than the published version"' "$RELEASE_TAG" "$latest"
          gh release create "$RELEASE_TAG" dist/release/* --target "$GITHUB_SHA" --draft --title "Intent $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Advance Firefox update feed after publication
        run: |
          cp dist/release/release-manifest.json "$RUNNER_TEMP/released-manifest.json"
          cp scripts/update-firefox-feed.py "$RUNNER_TEMP/update-firefox-feed.py"
          git fetch origin main
          git switch -C release-feed origin/main
          python3 "$RUNNER_TEMP/update-firefox-feed.py" "$RUNNER_TEMP/released-manifest.json" "$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firefox-updates.json
          git diff --cached --quiet || git commit -m "Update Firefox feed for $RELEASE_TAG"
          git push origin HEAD:main
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/intent.keychain-db" || true
          rm -f "$RUNNER_TEMP/intent.p12"
